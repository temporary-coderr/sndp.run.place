<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNDP Admin - Working</title>
<style>body{margin:0;font-family:Arial;background:#f5f7fb}.wrap{max-width:900px;margin:30px auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08)}input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;margin-top:6px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}button{width:100%;padding:16px;border:0;border-radius:12px;background:#1d4ed8;color:#fff;font-weight:700;cursor:pointer;margin-top:18px}#status{margin-top:16px;padding:14px;border:1px solid #e2e8f0;border-radius:12px;background:#f8fafc;line-height:1.6}.hidden{display:none}</style>
</head><body><div class="wrap">
<h1>SNDP Blog Admin - Fixed to Show on Site</h1>
<p style="color:#64748b">This now updates <code>posts/index.json</code> so it shows on sndp.run.place homepage instantly.</p>
<div class="grid">
<div><label>GitHub Owner</label><input id="githubOwner" value="temporary-coderr"></div>
<div><label>Repository</label><input id="githubRepo" value="sndp.run.place"></div>
<div><label>Branch</label><input id="githubBranch" value="main"></div>
<div><label>GitHub Token</label><input id="githubToken" type="password" placeholder="github_pat_..."></div>
<div class="full"><label>Title</label><input id="title" placeholder="My Article Title"></div>
<div><label>Category</label><select id="category"><option>Technology</option><option>Knowledge</option><option>Science</option><option>History</option><option>AI</option><option>India</option><option>Other</option></select></div>
<div><label>Image</label><input id="image" type="file" accept="image/*"></div>
<div class="full"><label>Short Description</label><input id="description" placeholder="Short summary for homepage"></div>
<div class="full"><label>Content (Markdown - saved as posts/slug.md)</label><textarea id="content" style="min-height:200px" placeholder="# Content..."></textarea></div>
</div>
<button id="publish">Publish & Show on Site</button>
<div id="status" class="hidden"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const set=(m,e)=>{const el=$('status');el.classList.remove('hidden');el.innerHTML=m;el.style.color=e?'#b91c1c':'#0f172a';el.style.background=e?'#fef2f2':'#f8fafc';}
const slugify=t=>t.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-').replace(/-+/g,'-').slice(0,60);
const toB64=f=>new Promise((r,j)=>{const rd=new FileReader();rd.onload=()=>r(rd.result.split(',')[1]);rd.onerror=j;rd.readAsDataURL(f);});
async function gh(url,token,opt={}){const res=await fetch(url,{...opt,headers:{'Authorization':`Bearer ${token}`,'Accept':'application/vnd.github+json','Content-Type':'application/json',...(opt.headers||{})}});const txt=await res.text();let data;try{data=JSON.parse(txt)}catch{data={message:txt}}return {ok:res.ok,status:res.status,data,txt};}
$('publish').onclick=async()=>{
 const owner=$('githubOwner').value.trim(),repo=$('githubRepo').value.trim(),branch=$('githubBranch').value.trim()||'main',token=$('githubToken').value.trim(),title=$('title').value.trim(),cat=$('category').value,desc=$('description').value.trim(),content=$('content').value.trim(),imgFile=$('image').files[0];
 if(!owner||!repo||!token||!title||!content){set('❌ Fill Owner, Repo, Token, Title, Content',true);return;}
 const btn=$('publish');btn.disabled=true;btn.textContent='Starting...';
 try{
  // 1. Check repo
  set('🔍 Checking repo...');let chk=await gh(`https://api.github.com/repos/${owner}/${repo}`,token);
  if(!chk.ok) throw new Error(`Repo Not Found: ${chk.data.message}. Recreate token with Only select repos -> ${repo} -> Contents: Read and write`);
  
  const date=new Date(), ds=date.toISOString().split('T')[0], slug=slugify(title);
  let imagePathForSite='';
  // 2. Upload image if any
  if(imgFile){
   set(`⏳ Uploading image ${imgFile.name}...`);btn.textContent='Uploading image...';
   const ext=imgFile.name.split('.').pop()||'webp';const imgName=`${ds}-${slug}.${ext}`;const imgPath=`images/${imgName}`;imagePathForSite=`/${imgPath}`;
   const b64=await toB64(imgFile);
   const up=await gh(`https://api.github.com/repos/${owner}/${repo}/contents/${imgPath}`,token,{method:'PUT',body:JSON.stringify({message:`Add image ${imgName}`,content:b64,branch})});
   if(!up.ok && up.status!==422) throw new Error(`Image upload failed ${up.status}: ${up.data.message}`);
  }
  // 3. Get existing posts/index.json
  set('📥 Loading posts/index.json...');btn.textContent='Loading index...';
  let existingPosts=[];let indexSha=null;
  const idxGet=await gh(`https://api.github.com/repos/${owner}/${repo}/contents/posts/index.json?ref=${branch}`,token);
  if(idxGet.ok){
   try{const decoded=atob(idxGet.data.content);existingPosts=JSON.parse(decoded);indexSha=idxGet.data.sha;}catch(e){existingPosts=[];}
  } else if(idxGet.status===404){
   existingPosts=[]; // will create new
  } else {
   throw new Error(`Cannot read posts/index.json [${idxGet.status}]: ${idxGet.data.message}`);
  }
  // 4. Create new post entry
  const newPost={title,description:desc,category:cat,date:ds,slug,image:imagePathForSite};
  // remove if slug exists
  existingPosts=existingPosts.filter(p=>p.slug!==slug);
  existingPosts.unshift(newPost);
  // 5. Upload updated index.json
  set('💾 Updating posts/index.json...');btn.textContent='Updating homepage list...';
  const newIndexContent=btoa(unescape(encodeURIComponent(JSON.stringify(existingPosts,null,2))));
  const putBody={message:`Update index: ${title}`,content:newIndexContent,branch};
  if(indexSha) putBody.sha=indexSha;
  const putIdx=await gh(`https://api.github.com/repos/${owner}/${repo}/contents/posts/index.json`,token,{method:'PUT',body:JSON.stringify(putBody)});
  if(!putIdx.ok) throw new Error(`Failed to update index.json [${putIdx.status}]: ${putIdx.data.message}`);
  // 6. Also create markdown file for article page
  set('📝 Creating markdown file...');btn.textContent='Creating article file...';
  const md=`---
title: "${title.replace(/"/g,'\"')}"
description: "${desc.replace(/"/g,'\"')}"
category: "${cat}"
date: "${ds}"
slug: "${slug}"
${imagePathForSite?`image: "${imagePathForSite}"
`:''}---
${content}
`;
  const mdPath=`posts/${ds}-${slug}.md`;
  const mdB64=btoa(unescape(encodeURIComponent(md)));
  const mdPut=await gh(`https://api.github.com/repos/${owner}/${repo}/contents/${mdPath}`,token,{method:'PUT',body:JSON.stringify({message:`Add post ${title}`,content:mdB64,branch})});
  // ignore if fails, index.json is main
  set(`✅ <b>Published & Live!</b><br><br>✅ Updated <code>posts/index.json</code> with ${existingPosts.length} posts<br>✅ File: <code>${mdPath}</code><br>${imagePathForSite?`✅ Image: <code>${imagePathForSite}</code><br>`:''}<br><b>Your site will show it in 30-60 seconds:</b><br><a href="https://sndp.run.place" target="_blank">https://sndp.run.place</a><br><a href="${putIdx.data.content.html_url}" target="_blank">View index.json on GitHub</a><br><br>Hard refresh homepage with Ctrl+Shift+R`);
 }catch(e){set(`❌ ${e.message}`,true);console.error(e);}
 finally{btn.disabled=false;btn.textContent='Publish & Show on Site';}
};
</script></body></html>
