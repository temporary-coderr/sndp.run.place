<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Admin</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .header {
      background: #0f172a;
      color: white;
      padding: 18px 0;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 0.08em;
    }

    .admin-shell {
      max-width: 980px;
      margin: 40px auto;
      background: white;
      border-radius: 18px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }

    .admin-header {
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      color: white;
      padding: 28px 32px;
    }

    .admin-header h1 {
      margin: 0;
      font-size: clamp(2rem, 2.5vw, 2.6rem);
    }

    .admin-header p {
      margin: 10px 0 0;
      opacity: 0.9;
    }

    .admin-body {
      padding: 30px 32px 36px;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 4px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-weight: 600;
      color: #334155;
      font-size: 0.96rem;
    }

    input, select, textarea, button {
      font: inherit;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 14px;
      background: #f8fafc;
      color: #0f172a;
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
      background: white;
    }

    textarea {
      min-height: 240px;
      resize: vertical;
    }

    .meta-note {
      font-size: 0.8rem;
      color: #64748b;
      margin: -4px 0 0;
    }

    .publish-wrap {
      margin-top: 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #publish {
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 16px 20px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 24px rgba(37, 99, 235, 0.25);
    }

    #publish:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(37, 99, 235, 0.35);
    }

    #publish:disabled {
      opacity: 0.7;
      cursor: wait;
      transform: none;
    }

    #status {
      border-radius: 12px;
      padding: 14px 16px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      line-height: 1.5;
      min-height: 22px;
    }

    #status.hidden {
      display: none;
    }

    @media (max-width: 760px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }

      .admin-header,
      .admin-body {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a href="index.html" class="logo">SND P</a>
      <nav><a href="index.html" style="color: white; text-decoration: none;">View Site</a></nav>
    </div>
  </header>

  <main class="container">
    <section class="admin-shell">
      <div class="admin-header">
        <h1>Publish Article</h1>
        <p>Single-click publishing to your GitHub blog.</p>
      </div>

      <div class="admin-body">
        <div class="admin-grid">
          <div class="field">
            <label for="githubOwner">GitHub Owner</label>
            <input id="githubOwner" value="temporary-coderr">
          </div>

          <div class="field">
            <label for="githubRepo">Repository</label>
            <input id="githubRepo" value="sndp.run.place">
          </div>

          <div class="field">
            <label for="githubBranch">Branch</label>
            <input id="githubBranch" value="main">
          </div>

          <div class="field">
            <label for="githubToken">GitHub Token</label>
            <input id="githubToken" type="password" placeholder="github_pat_..." autocomplete="off">
          </div>

          <div class="field full">
            <label for="title">Article Title</label>
            <input id="title" placeholder="How AI Is Changing Everyday Work">
          </div>

          <div class="field">
            <label for="category">Category</label>
            <select id="category">
              <option>Knowledge</option>
              <option>Technology</option>
              <option>Science</option>
              <option>History</option>
              <option>AI</option>
              <option>India</option>
              <option>Other</option>
            </select>
          </div>

          <div class="field">
            <label for="image">Featured Image</label>
            <input id="image" type="file" accept="image/png,image/jpeg,image/webp">
          </div>

          <div class="field full">
            <label for="description">Short Description</label>
            <input id="description" placeholder="A short summary that appears on the homepage.">
          </div>

          <div class="field full">
            <label for="content">Article Content</label>
            <textarea id="content" placeholder="# My Article

Write your article here in Markdown.

## Subtitle

Use headings, bold, links, and lists.

- One
- Two
- Three
"></textarea>
          </div>
        </div>

        <div class="publish-wrap">
          <button id="publish">Publish Article</button>
          <div id="status" class="status hidden"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="admin.js"></script>
</body>
</html>
